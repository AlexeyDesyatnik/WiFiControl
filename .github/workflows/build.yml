# Сборка и тесты на каждый push в main и на каждый pull request
name: Сборка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: dotnet build WiFiControl.sln -c Release

      # Тесты Machine читают настройки компьютера, а у виртуальной машины GitHub они не те, что на рабочих машинах
      - name: Тесты
        run: dotnet test WiFiControl.sln -c Release --no-build --filter "Category!=Machine"
